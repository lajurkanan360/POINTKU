<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loyalty Card</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9dfcb;--card:#e0d3b9;--ink:#5b3a29;--soft:#8a6a55;--line:#c9b99b;--accent:#6b3f2a;--ok:#2f6b4f;--bad:#a33a2a}
@media (prefers-color-scheme:dark){:root{--bg:#241a14;--card:#33261d;--ink:#f0e4d0;--soft:#b99d85;--line:#4d3b2d;--accent:#d9a577;--ok:#7fc4a0;--bad:#e8907f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Fredoka',system-ui,sans-serif;min-height:100vh}
main{max-width:520px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:28px;margin:4px 0 2px}
.sub{color:var(--soft);margin:0 0 18px}
.row{display:flex;gap:8px;margin-bottom:10px}
input{flex:1;min-width:0;font:inherit;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 16px;background:var(--accent);color:var(--bg);cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
button:disabled{opacity:.4}
.card{background:var(--card);border-radius:20px;padding:20px;margin:16px 0;border:2px solid var(--line)}
.card h2{margin:0;font-size:24px}.card small{color:var(--soft)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:18px 0}
.slot{aspect-ratio:1;border-radius:50%;border:3px dashed var(--line);display:grid;place-items:center;font-size:12px;color:var(--soft)}
.slot.on{border:4px solid var(--accent);background:radial-gradient(circle,var(--accent) 0 38%,transparent 40%);color:transparent;transform:rotate(-8deg)}
.slot.free{border-style:solid;border-color:var(--accent);font-weight:700;color:var(--accent);font-size:13px}
.slot.free.on{background:var(--accent);color:var(--bg)}
.actions{display:flex;gap:8px}.actions button{flex:1}
.msg{padding:10px 14px;border-radius:12px;background:var(--card);border:2px solid var(--ok);color:var(--ok);font-weight:600;margin:10px 0}
.msg.err{border-color:var(--bad);color:var(--bad)}
.list{list-style:none;padding:0}
.list li{display:flex;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.list li span:last-child{color:var(--soft)}
.hide{display:none}
</style>
</head>
<body>
<main>
  <h1 id="title">Loyalty Card</h1>
  <p class="sub" id="rule"></p>
  <div id="msg"></div>

  <!-- Tampilan pelanggan -->
  <section id="cust">
    <div class="row"><input id="cphone" placeholder="No. HP" inputmode="tel"><input id="cpin" placeholder="PIN" inputmode="numeric" maxlength="4" type="password"></div>
    <div class="row"><button id="cek" style="flex:1">Lihat stamp saya</button></div>
  </section>

  <!-- Tampilan kasir (buka dengan ?kasir) -->
  <section id="kasir" class="hide">
    <div class="row" id="login"><input id="apin" placeholder="PIN kasir" type="password"><button id="enter">Masuk</button></div>
    <div id="kform" class="hide">
      <div class="row"><input id="kphone" placeholder="No. HP" inputmode="tel"><input id="kname" placeholder="Nama (pelanggan baru)"></div>
      <div class="row"><input id="kpin" placeholder="PIN 4 digit (pelanggan baru)" inputmode="numeric" maxlength="4"><button id="kfind">Cari / Tambah</button></div>
    </div>
  </section>

  <div id="view"></div>
  <ul class="list" id="list"></ul>
</main>
<script>
// Isi dengan URL Web App dari Apps Script (Deploy > Manage deployments)
var API_URL = 'https://script.google.com/macros/s/AKfycbwTMzpZ4vdVS7koKpyRZtxqa5-RHeyOUPZedjV1NuMpOwTBytpHBZiUn2_Sk_qM_IxUow/exec';
var SHOP = 'Kedai Kopi';

var $ = function (id) { return document.getElementById(id); };
var admin = '', isKasir = location.search.indexOf('kasir') > -1;
function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function flash(t, err) { $('msg').innerHTML = t ? '<div class="msg' + (err ? ' err' : '') + '">' + esc(t) + '</div>' : ''; }

function api(body) {
  flash('Memuat...');
  body.admin = admin;
  return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
    .then(function (r) { return r.json(); })
    .then(function (d) { if (!d.ok) { flash(d.error, true); return null; } flash(''); return d; })
    .catch(function () { flash('Gagal terhubung. Cek internet atau URL Apps Script.', true); return null; });
}

function draw(c) {
  $('rule').textContent = 'Kumpulkan ' + (c.goal - 1) + ' stamp, stamp ke-' + c.goal + ' gratis.';
  var h = '';
  for (var i = 1; i <= c.goal; i++) {
    var last = i === c.goal;
    h += '<div class="slot' + (last ? ' free' : '') + (c.stamps >= i ? ' on' : '') + '">' + (last ? 'FREE' : i) + '</div>';
  }
  var full = c.stamps >= c.goal;
  var act = '';
  if (isKasir) {
    act = '<div class="actions">' + (full ? '<button id="a-redeem">Tebus gratis</button>' : '<button id="a-stamp">Tambah stamp</button>') +
      '<button class="ghost" id="a-undo"' + (c.stamps ? '' : ' disabled') + '>Batalkan</button></div>';
  } else if (full) {
    act = '<p><b>Kartu penuh! Tunjukkan layar ini ke kasir untuk tebus gratis.</b></p>';
  } else {
    act = '<p>Tinggal ' + (c.goal - c.stamps) + ' stamp lagi sampai gratis.</p>';
  }
  $('view').innerHTML = '<div class="card"><h2>' + esc(c.name) + '</h2><small>' + esc(c.phone) + ' · Gratis ditebus: ' + c.redeemed + 'x</small><div class="grid">' + h + '</div>' + act + '</div>';
  if (isKasir) {
    var go = function (a) { return function () { api({ action: a, phone: c.phone }).then(function (d) { if (d) { draw(d); loadList(); } }); }; };
    if ($('a-stamp')) $('a-stamp').onclick = go('stamp');
    if ($('a-redeem')) $('a-redeem').onclick = go('redeem');
    $('a-undo').onclick = go('undo');
  }
}

function loadList() {
  api({ action: 'list' }).then(function (d) {
    if (!d) return;
    $('list').innerHTML = d.list.length ? '' : '<li>Belum ada pelanggan.</li>';
    d.list.forEach(function (x) {
      var li = document.createElement('li');
      li.innerHTML = '<span>' + esc(x.name) + '</span><span>' + x.stamps + '/' + d.goal + '</span>';
      li.onclick = function () { $('kphone').value = x.phone; $('kfind').click(); window.scrollTo(0, 0); };
      $('list').appendChild(li);
    });
  });
}

$('title').textContent = SHOP + ' Loyalty Card';

if (isKasir) {
  $('cust').classList.add('hide'); $('kasir').classList.remove('hide');
  $('enter').onclick = function () {
    admin = $('apin').value;
    api({ action: 'list' }).then(function (d) {
      if (!d) { admin = ''; return; }
      $('login').classList.add('hide'); $('kform').classList.remove('hide'); loadList();
    });
  };
  $('kfind').onclick = function () {
    api({ action: 'add', phone: $('kphone').value, name: $('kname').value, pin: $('kpin').value }).then(function (d) {
      if (!d) return;
      if (d.isNew) { flash('Pelanggan baru dibuat. Beri tahu pelanggan PIN-nya.'); loadList(); }
      draw(d);
    });
  };
} else {
  $('cek').onclick = function () {
    api({ action: 'cek', phone: $('cphone').value, pin: $('cpin').value }).then(function (d) { if (d) draw(d); });
  };
}
</script>
</body>
</html>
